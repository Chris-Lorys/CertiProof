{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card narrow">
  <div class="card-body">
    <h1 style="font-size:21px">Connexion de l'établissement</h1>
    <p class="muted small" style="margin-top:6px">{{ issuer_name }}. Seul ce compte peut émettre ou révoquer une
      attestation ; la vérification est ouverte à tous.</p>
    <form method="post" style="margin-top:18px">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="field"><label for="username">Identifiant</label>
        <input id="username" name="username" value="{{ username }}" autocomplete="username" required {{ 'autofocus' if not username }}></div>
      <div class="field"><label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required {{ 'autofocus' if username }}></div>
      <button class="btn-block">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
